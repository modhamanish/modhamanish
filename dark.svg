<!-- Realistic Optical Laser Scanner -->
<g id="scannerBeam">
  <!-- Trailing Phosphor Decay -->
  <rect x="0" y="-32" width="1180" height="32" fill="url(#scanTrail)" style="mix-blend-mode:screen"/>
  <!-- Forward Optical Bloom -->
  <rect x="0" y="0" width="1180" height="6" fill="url(#frontGlow)" style="mix-blend-mode:screen"/>
  <!-- Ambient Laser Glow -->
  <line x1="16" y1="0" x2="1164" y2="0" stroke="url(#laserHGrad)" stroke-width="3.5" opacity="0.6" filter="url(#softGlow)"/>
  <!-- Razor-Sharp Core Filament -->
  <line x1="16" y1="0" x2="1164" y2="0" stroke="url(#laserHGrad)" stroke-width="1.5" opacity="0.95"/>
  <line x1="30" y1="0" x2="1150" y2="0" stroke="#FFFFFF" stroke-width="0.75" opacity="0.95"/>

  <animateTransform id="initScan" attributeName="transform" type="translate" from="0 0" to="0 560" dur="2.4s" begin="0s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 -35" to="0 595" dur="3.6s" begin="initScan.end + 0.6s" repeatCount="indefinite"/>
</g>

<rect x="3" y="3" width="1174" height="554" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.8">
  <animate attributeName="opacity" values="0.5;0.95;0.5" dur="3.2s" repeatCount="indefinite"/>
</rect>
</svg>
