<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Profile Mask & Loop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      color: #ffffff;
      gap: 28px;
      padding: 20px;
    }

    /* Style Switcher Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      background: #161f33;
      padding: 6px;
      border-radius: 50px;
      border: 1px solid #2a3655;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    /* Main Profile Container */
    .avatar-stage {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================
       STYLE 1: Liquid Morphing Blob Mask + Glow
       ========================================== */
    .style-blob .glow-ring {
      position: absolute;
      inset: -8px;
      background: linear-gradient(45deg, #ff007f, #00f2fe, #7928ca, #ff007f);
      background-size: 300% 300%;
      animation: morphLoop 6s ease-in-out infinite, gradientShift 4s ease infinite;
      filter: blur(8px);
      z-index: 1;
    }

    .style-blob .border-ring {
      position: absolute;
      inset: -4px;
      background: linear-gradient(45deg, #ff007f, #00f2fe, #7928ca);
      background-size: 200% 200%;
      animation: morphLoop 6s ease-in-out infinite, gradientShift 4s ease infinite;
      z-index: 2;
    }

    .style-blob .image-mask {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 3;
      background: #1e293b;
      animation: morphLoop 6s ease-in-out infinite;
    }

    /* ==========================================
       STYLE 2: Neon Spinning Conic Border
       ========================================== */
    .style-neon .glow-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff0055, #00f2fe, #7000ff, #ff0055);
      filter: blur(14px);
      animation: spinLoop 3s linear infinite;
      z-index: 1;
    }

    .style-neon .border-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #ff0055, #00f2fe, #7000ff, #ff0055);
      animation: spinLoop 3s linear infinite;
      z-index: 2;
    }

    .style-neon .image-mask {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      z-index: 3;
      background: #1e293b;
      border: 4px solid #0b0f19;
    }

    /* ==========================================
       STYLE 3: Animated Hexagon / Wave Pulse
       ========================================== */
    .style-pulse .glow-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid #00f2fe;
      animation: pulseExpand 2.4s ease-out infinite;
      z-index: 1;
    }

    .style-pulse .border-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid #ff007f;
      animation: pulseExpand 2.4s ease-out 1.2s infinite;
      z-index: 2;
    }

    .style-pulse .image-mask {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      z-index: 3;
      background: #1e293b;
      border: 3px solid #00f2fe;
      animation: floatLoop 3s ease-in-out infinite;
    }

    /* Image styling inside the mask */
    .image-mask img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .avatar-stage:hover .image-mask img {
      transform: scale(1.08);
    }

    /* Upload Button Styling */
    .upload-label {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      padding: 12px 26px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .upload-label:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(139, 92, 246, 0.5);
    }

    input[type="file"] {
      display: none;
    }

    /* ==========================================
       KEYFRAME ANIMATIONS (INFINITE LOOP)
       ========================================== */
    @keyframes morphLoop {
      0%, 100% {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }
      50% {
        border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
      }
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes spinLoop {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseExpand {
      0% {
        transform: scale(1);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.38);
        opacity: 0;
      }
    }

    @keyframes floatLoop {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- Style Selector -->
  <div class="tabs">
    <button class="tab-btn active" onclick="setStyle('style-blob', this)">Liquid Mask</button>
    <button class="tab-btn" onclick="setStyle('style-neon', this)">Neon Ring</button>
    <button class="tab-btn" onclick="setStyle('style-pulse', this)">Pulse Wave</button>
  </div>

  <!-- Animated Masked Profile Container -->
  <div class="avatar-stage style-blob" id="avatarStage">
    <div class="glow-ring"></div>
    <div class="border-ring"></div>
    <div class="image-mask">
      <img id="profilePreview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80" alt="Profile">
    </div>
  </div>

  <!-- Image Upload Button -->
  <label for="imageUpload" class="upload-label">
    Upload Your Image
  </label>
  <input type="file" id="imageUpload" accept="image/*">

  <script>
    const imageUpload = document.getElementById('imageUpload');
    const profilePreview = document.getElementById('profilePreview');
    const avatarStage = document.getElementById('avatarStage');

    // Jab user image select karega to turant mask ke andar preview update ho jayega
    imageUpload.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          profilePreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Different animation styles switch karne ke liye function
    function setStyle(styleClass, btnElement) {
      avatarStage.className = 'avatar-stage ' + styleClass;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }
  </script>

</body>
</html>
