<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>300x300 HD Animated Profile Mask & Loop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0f19;
      color: #ffffff;
      gap: 22px;
      padding: 20px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      background: #161f33;
      padding: 6px;
      border-radius: 50px;
      border: 1px solid #2a3655;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: #3b82f6;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    /* 300x300 1:1 Stage Wrapper */
    .canvas-wrapper {
      width: 300px;
      height: 300px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #2a3655;
      background-image: 
        linear-gradient(45deg, #161f33 25%, transparent 25%), 
        linear-gradient(-45deg, #161f33 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #161f33 75%), 
        linear-gradient(-45deg, transparent 75%, #161f33 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-color: #0b0f19;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
    }

    canvas {
      width: 300px;
      height: 300px;
      display: block;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .upload-btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
    }

    .export-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }

    input[type="file"] {
      display: none;
    }

    .status-text {
      font-size: 13px;
      color: #94a3b8;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="setStyle('blob', this)">Liquid Mask</button>
    <button class="tab-btn" onclick="setStyle('neon', this)">Neon Ring</button>
    <button class="tab-btn" onclick="setStyle('pulse', this)">Pulse Wave</button>
    <button class="tab-btn" onclick="setStyle('slanted', this)">Slanted Slices</button>
    <button class="tab-btn" onclick="setStyle('ink', this)">Ink Bloom</button>
  </div>

  <!-- 300x300 Display Box (Internally rendered at 3x 900x900 for Ultra-HD Crisp Edges) -->
  <div class="canvas-wrapper">
    <canvas id="previewCanvas" width="900" height="900"></canvas>
  </div>

  <div class="controls">
    <label for="imageUpload" class="btn upload-btn">
      Upload Your Image
    </label>
    <input type="file" id="imageUpload" accept="image/*">

    <button id="exportBtn" class="btn export-btn">
      Export 300x300 HD GIF
    </button>
  </div>

  <div class="status-text" id="statusText">Size: 300x300 (1:1) | Border: Exact 4px | Loop Speed: 6s</div>

  <script type="module">
    import { GIFEncoder, quantize, applyPalette } from 'https://unpkg.com/gifenc@1.0.3/dist/gifenc.esm.js';

    const EXPORT_SIZE = 300;
    const SCALE = 3; // 3x Super-Sampling (900x900 internal render -> 300x300 crisp output)
    const RENDER_SIZE = EXPORT_SIZE * SCALE; // 900
    const CENTER = RENDER_SIZE / 2; // 450

    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = EXPORT_SIZE;
    exportCanvas.height = EXPORT_SIZE;
    const exportCtx = exportCanvas.getContext('2d', { willReadFrequently: true });
    exportCtx.imageSmoothingEnabled = true;
    exportCtx.imageSmoothingQuality = 'high';

    let currentStyle = 'blob';
    let isExporting = false;
    let animStartTime = performance.now();

    let userImg = new Image();
    userImg.crossOrigin = 'anonymous';
    userImg.src = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=1000&auto=format&fit=crop&q=95';

    function updateStatusText() {
      const statusText = document.getElementById('statusText');
      if (currentStyle === 'blob') {
        statusText.textContent = 'Size: 300x300 (1:1) | Border: Exact 4px | Loop Speed: 6s';
      } else if (currentStyle === 'neon') {
        statusText.textContent = 'Size: 300x300 (1:1) | Rotating Conic Glow | Loop Speed: 3s';
      } else if (currentStyle === 'pulse') {
        statusText.textContent = 'Size: 300x300 (1:1) | Double Wave & Float | Loop Speed: 3s';
      } else if (currentStyle === 'slanted') {
        statusText.textContent = 'Size: 300x300 (1:1) | 4 Slanted Strips | In-Grow Animation';
      } else if (currentStyle === 'ink') {
        statusText.textContent = 'Size: 300x300 (1:1) | Organic Ink Splatter | Smooth Bloom (No Out)';
      }
    }

    window.setStyle = (style, btn) => {
      if (isExporting) return;
      currentStyle = style;
      animStartTime = performance.now();
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateStatusText();
    };

    document.getElementById('imageUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => { userImg = img; };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Exact CSS cubic-bezier(0.42, 0, 0.58, 1) solver for "ease-in-out"
    function cssEaseInOut(p) {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      const x1 = 0.42, y1 = 0.0, x2 = 0.58, y2 = 1.0;
      let u = p;
      for (let i = 0; i < 8; i++) {
        const x = 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u - p;
        const dx = 3 * (1 - u) * (1 - u) * x1 + 6 * (1 - u) * u * (x2 - x1) + 3 * u * u * (1 - x2);
        if (Math.abs(dx) < 1e-6) break;
        u -= x / dx;
      }
      return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
    }

    // Smooth cubic-bezier(0.35, 0.0, 0.2, 1.0) for Slanted Strips In-Grow animation
    function easeSlanted(p) {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      const x1 = 0.35, y1 = 0.0, x2 = 0.2, y2 = 1.0;
      let u = p;
      for (let i = 0; i < 8; i++) {
        const x = 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u - p;
        const dx = 3 * (1 - u) * (1 - u) * x1 + 6 * (1 - u) * u * (x2 - x1) + 3 * u * u * (1 - x2);
        if (Math.abs(dx) < 1e-6) break;
        u -= x / dx;
      }
      return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
    }

    // 4 Slanted strips matched 1:1 to reference paid animated profile and image:
    // Slanted line equation: u = x + 0.5 * y  =>  x = u - 0.5 * y
    // Exact 5px transparent gaps between strips
    const SLANTED_STRIPS = [
      { u_l: 117, u_r: 160, y_min: 61,  y_max: 199 },
      { u_l: 165, u_r: 225, y_min: 26,  y_max: 298 },
      { u_l: 230, u_r: 290, y_min: 1,   y_max: 265 },
      { u_l: 295, u_r: 338, y_min: 127, y_max: 265 }
    ];

    function drawSlantedStrips(rawPIn, rawPOut) {
      ctx.clearRect(0, 0, RENDER_SIZE, RENDER_SIZE);

      const pIn = easeSlanted(rawPIn);
      const pOut = easeSlanted(rawPOut);

      ctx.save();
      ctx.beginPath();
      let hasVisibleStrip = false;

      for (let i = 0; i < SLANTED_STRIPS.length; i++) {
        const strip = SLANTED_STRIPS[i];
        const yMin = strip.y_min * SCALE;
        const yMax = strip.y_max * SCALE;
        const totalH = yMax - yMin;

        // In-grow: top edge grows upward from yMax to yMin
        const currTop = yMax - pIn * totalH;
        // Shrink-out: bottom edge shrinks upward from yMax to yMin
        const currBottom = yMax - pOut * totalH;

        if (currTop < currBottom) {
          hasVisibleStrip = true;
          const u1 = strip.u_l * SCALE;
          const u2 = strip.u_r * SCALE;

          ctx.moveTo(u1 - 0.5 * currTop, currTop);
          ctx.lineTo(u2 - 0.5 * currTop, currTop);
          ctx.lineTo(u2 - 0.5 * currBottom, currBottom);
          ctx.lineTo(u1 - 0.5 * currBottom, currBottom);
          ctx.closePath();
        }
      }

      if (hasVisibleStrip) {
        ctx.clip();

        // Cinematic In-Animation: Scale down from 1.16 to 1.0, and move down into position
        const inFactor = Math.max(0, 1 - pIn);
        const imgScale = 1.0 + inFactor * 0.16;      // Initial scale ~1.16x -> smoothly decreases to 1.0x
        const imgOffsetY = -inFactor * (22 * SCALE); // Starts -22px up -> smoothly glides down to 0px

        ctx.save();
        ctx.translate(CENTER, CENTER + imgOffsetY);
        ctx.scale(imgScale, imgScale);
        ctx.translate(-CENTER, -CENTER);

        drawImageCover(ctx, userImg, 0, 0, RENDER_SIZE, RENDER_SIZE);
        ctx.restore();
      }
      ctx.restore();
    }

    // 5th Style: Organic Ink Splatter Mask with Separate Floating Droplets
    const INK_DROPLETS = [
      // Primary separated ink droplets (radii 5.0 - 9.5)
      { angle: 0.35, distRel: 1.14, rad: 8.5 },
      { angle: 0.78, distRel: 1.20, rad: 5.0 },
      { angle: 1.15, distRel: 1.15, rad: 7.0 },
      { angle: 1.55, distRel: 1.22, rad: 9.0 },
      { angle: 1.95, distRel: 1.13, rad: 6.0 },
      { angle: 2.35, distRel: 1.18, rad: 7.5 },
      { angle: 2.80, distRel: 1.12, rad: 8.0 },
      { angle: 3.25, distRel: 1.22, rad: 6.5 },
      { angle: 3.70, distRel: 1.15, rad: 7.5 },
      { angle: 4.15, distRel: 1.20, rad: 9.5 },
      { angle: 4.60, distRel: 1.14, rad: 6.0 },
      { angle: 5.05, distRel: 1.21, rad: 8.0 },
      { angle: 5.50, distRel: 1.16, rad: 7.0 },
      { angle: 5.95, distRel: 1.22, rad: 8.5 },
      // Micro splatters (radii 2.5 - 3.5)
      { angle: 0.55, distRel: 1.28, rad: 3.0 },
      { angle: 1.35, distRel: 1.29, rad: 3.5 },
      { angle: 2.15, distRel: 1.27, rad: 2.5 },
      { angle: 3.45, distRel: 1.30, rad: 3.0 },
      { angle: 4.35, distRel: 1.28, rad: 3.5 },
      { angle: 5.25, distRel: 1.29, rad: 3.0 }
    ];

    // Smooth, gentle ease-out curve for luxurious slow ink expansion
    function easeInkSlow(p) {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      const x1 = 0.22, y1 = 1.0, x2 = 0.36, y2 = 1.0;
      let u = p;
      for (let i = 0; i < 8; i++) {
        const x = 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u - p;
        const dx = 3 * (1 - u) * (1 - u) * x1 + 6 * (1 - u) * u * (x2 - x1) + 3 * u * u * (1 - x2);
        if (Math.abs(dx) < 1e-6) break;
        u -= x / dx;
      }
      return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
    }

    function drawInkBloom(rawP) {
      ctx.clearRect(0, 0, RENDER_SIZE, RENDER_SIZE);

      const p = easeInkSlow(rawP);
      if (p <= 0.005) return;

      const maxR = 112 * SCALE;
      // Main ink body expands from 15% to 100%
      const baseR = maxR * (0.15 + 0.85 * p);
      // Retains organic harmonic ink turbulence (0.19 at full bloom) so it stays an ink splatter
      const turb = 0.35 * (1 - p * 0.45);

      ctx.save();
      ctx.beginPath();

      // 1. Organic ink pool boundary
      const numPts = 160;
      for (let i = 0; i <= numPts; i++) {
        const th = (i % numPts) * 2 * Math.PI / numPts;
        const noise = (
          Math.sin(th * 3 + 1.2) * 0.42 +
          Math.cos(th * 5 - 0.7) * 0.32 +
          Math.sin(th * 7 + 2.1) * 0.22 +
          Math.cos(th * 11 + 0.4) * 0.15 +
          Math.sin(th * 13 - 1.0) * 0.10
        );
        const r = baseR * (1 + turb * noise);
        const x = CENTER + r * Math.cos(th);
        const y = CENTER + r * Math.sin(th);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      // 2. Separate satellite droplets & micro-splatters (stay visible and separate)
      for (let i = 0; i < INK_DROPLETS.length; i++) {
        const d = INK_DROPLETS[i];
        const dropDist = (baseR * 0.3) + (baseR * d.distRel - baseR * 0.3) * p;
        const dropX = CENTER + dropDist * Math.cos(d.angle);
        const dropY = CENTER + dropDist * Math.sin(d.angle);
        const dropRad = (d.rad * SCALE) * Math.min(1.0, p * 1.3);

        if (dropRad > 0.5) {
          ctx.moveTo(dropX + dropRad, dropY);
          ctx.arc(dropX, dropY, dropRad, 0, Math.PI * 2);
        }
      }

      ctx.clip();

      // Gentle cinematic in-animation: subtle scale down and glide
      const inFactor = Math.max(0, 1 - p);
      const imgScale = 1.0 + inFactor * 0.14;      // ~1.14x zoom -> gently eases to 1.0x
      const imgOffsetY = -inFactor * (16 * SCALE); // Starts -16px up -> gently glides to 0px

      ctx.save();
      ctx.translate(CENTER, CENTER + imgOffsetY);
      ctx.scale(imgScale, imgScale);
      ctx.translate(-CENTER, -CENTER);

      drawImageCover(ctx, userImg, 0, 0, RENDER_SIZE, RENDER_SIZE);
      ctx.restore();

      ctx.restore();
    }

    function lerp(a, b, m) {
      return a + (b - a) * m;
    }

    // Center-crop image (object-fit: cover)
    function drawImageCover(targetCtx, img, x, y, w, h) {
      if (!img.complete || !img.naturalWidth) return;
      const imgRatio = img.naturalWidth / img.naturalHeight;
      const winRatio = w / h;
      let sx, sy, sw, sh;

      if (imgRatio > winRatio) {
        sh = img.naturalHeight;
        sw = sh * winRatio;
        sx = (img.naturalWidth - sw) / 2;
        sy = 0;
      } else {
        sw = img.naturalWidth;
        sh = sw / winRatio;
        sx = 0;
        sy = (img.naturalHeight - sh) / 2;
      }
      targetCtx.imageSmoothingEnabled = true;
      targetCtx.imageSmoothingQuality = 'high';
      targetCtx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }

    // Exact 1:1 reproduction of reference file @keyframes morphLoop:
    // 0%, 100%: border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
    // 50%:      border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
    function traceReferenceBlobPath(targetCtx, cx, cy, boxSize, t) {
      // 0 -> 0.5 uses ease-in-out (0 -> 1), 0.5 -> 1.0 uses ease-in-out (1 -> 0)
      const halfProgress = t < 0.5 ? (t * 2) : ((1 - t) * 2);
      const m = cssEaseInOut(halfProgress);

      let rx = [
        lerp(0.60, 0.30, m) * boxSize, // Top-Left X
        lerp(0.40, 0.60, m) * boxSize, // Top-Right X
        lerp(0.30, 0.70, m) * boxSize, // Bottom-Right X
        lerp(0.70, 0.40, m) * boxSize  // Bottom-Left X
      ];

      let ry = [
        lerp(0.60, 0.50, m) * boxSize, // Top-Left Y
        lerp(0.30, 0.60, m) * boxSize, // Top-Right Y
        lerp(0.70, 0.30, m) * boxSize, // Bottom-Right Y
        lerp(0.40, 0.60, m) * boxSize  // Bottom-Left Y
      ];

      // W3C CSS border-radius corner-scaling rule (when 70% + 40% = 110% at 50% keyframe)
      const f = Math.min(
        1,
        boxSize / (rx[0] + rx[1]),
        boxSize / (rx[3] + rx[2]),
        boxSize / (ry[0] + ry[3]),
        boxSize / (ry[1] + ry[2])
      );

      for (let i = 0; i < 4; i++) {
        rx[i] *= f;
        ry[i] *= f;
      }

      const x = cx - boxSize / 2;
      const y = cy - boxSize / 2;
      const w = boxSize;
      const h = boxSize;
      const k = 0.5522847498;

      targetCtx.beginPath();
      targetCtx.moveTo(x + rx[0], y);

      // Top-Right
      targetCtx.lineTo(x + w - rx[1], y);
      targetCtx.bezierCurveTo(x + w - rx[1] * (1 - k), y, x + w, y + ry[1] * (1 - k), x + w, y + ry[1]);

      // Bottom-Right
      targetCtx.lineTo(x + w, y + h - ry[2]);
      targetCtx.bezierCurveTo(x + w, y + h - ry[2] * (1 - k), x + w - rx[2] * (1 - k), y + h, x + w - rx[2], y + h);

      // Bottom-Left
      targetCtx.lineTo(x + rx[3], y + h);
      targetCtx.bezierCurveTo(x + rx[3] * (1 - k), y + h, x, y + h - ry[3] * (1 - k), x, y + h - ry[3]);

      // Top-Left
      targetCtx.lineTo(x, y + ry[0]);
      targetCtx.bezierCurveTo(x, y + ry[0] * (1 - k), x + rx[0] * (1 - k), y, x + rx[0], y);

      targetCtx.closePath();
    }

    // Core Renderer: t is normalized loop progress (0.0 -> 1.0)
    function renderFrame(t) {
      ctx.clearRect(0, 0, RENDER_SIZE, RENDER_SIZE);
      const angle = t * Math.PI * 2;

      // Reference file dimensions scaled to 300x300 stage:
      // .avatar-stage = 240px, .border-ring = inset -4px (248px = exact 4px border!)
      const IMG_BOX = 240 * SCALE;           // 240px on 300x300
      const BORDER_BOX = (240 + 8) * SCALE;  // 248px on 300x300 (inset: -4px = 4px border on all sides)

      if (currentStyle === 'blob') {
        // Exact 45deg linear-gradient(#ff007f, #00f2fe, #7928ca) with background-size: 200% 200% shift
        const shiftP = cssEaseInOut(t < 0.5 ? (t * 2) : ((1 - t) * 2));
        const offset = (shiftP - 0.5) * (BORDER_BOX * 0.45);

        const x0 = CENTER - BORDER_BOX / 2 - offset;
        const y0 = CENTER + BORDER_BOX / 2 + offset;
        const x1 = CENTER + BORDER_BOX / 2 - offset;
        const y1 = CENTER - BORDER_BOX / 2 + offset;

        const grad = ctx.createLinearGradient(x0, y0, x1, y1);
        grad.addColorStop(0, '#ff007f');
        grad.addColorStop(0.5, '#00f2fe');
        grad.addColorStop(1, '#7928ca');

        // 1. Exact 4px Border Ring (inset: -4px -> 248px)
        traceReferenceBlobPath(ctx, CENTER, CENTER, BORDER_BOX, t);
        ctx.fillStyle = grad;
        ctx.fill();

        // 2. Inner Liquid Masked Image (240px)
        ctx.save();
        traceReferenceBlobPath(ctx, CENTER, CENTER, IMG_BOX, t);
        ctx.clip();
        const imgOffset = (RENDER_SIZE - IMG_BOX) / 2;
        drawImageCover(ctx, userImg, imgOffset, imgOffset, IMG_BOX, IMG_BOX);
        ctx.restore();

      } else if (currentStyle === 'neon') {
        // Reference: .border-ring inset: -5px (250px -> radius 125px)
        const outerR = 125 * SCALE;
        const sepR = 120 * SCALE;
        const innerR = 116 * SCALE; // 4px solid #0b0f19 border

        ctx.save();
        ctx.translate(CENTER, CENTER);
        ctx.rotate(angle);

        const conic = ctx.createConicGradient(0, 0, 0);
        conic.addColorStop(0, '#ff0055');
        conic.addColorStop(0.33, '#00f2fe');
        conic.addColorStop(0.66, '#7000ff');
        conic.addColorStop(1, '#ff0055');

        ctx.beginPath();
        ctx.arc(0, 0, outerR, 0, Math.PI * 2);
        ctx.fillStyle = conic;
        ctx.fill();
        ctx.restore();

        ctx.beginPath();
        ctx.arc(CENTER, CENTER, sepR, 0, Math.PI * 2);
        ctx.fillStyle = '#0b0f19';
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.arc(CENTER, CENTER, innerR, 0, Math.PI * 2);
        ctx.clip();
        drawImageCover(ctx, userImg, CENTER - innerR, CENTER - innerR, innerR * 2, innerR * 2);
        ctx.restore();

      } else if (currentStyle === 'pulse') {
        // Reference: 240px circle (radius 120px) + pulse rings + floatY(-8px)
        const baseR = 110 * SCALE;
        for (let i = 0; i < 2; i++) {
          const p = (t + i * 0.5) % 1;
          const radius = baseR + p * (36 * SCALE);
          const lineWidth = Math.max(1.5 * SCALE, (1 - p) * (3.5 * SCALE));

          ctx.beginPath();
          ctx.arc(CENTER, CENTER, radius, 0, Math.PI * 2);
          ctx.strokeStyle = i === 0 ? '#00f2fe' : '#ff007f';
          ctx.lineWidth = lineWidth;
          ctx.stroke();
        }

        const halfP = t < 0.5 ? (t * 2) : ((1 - t) * 2);
        const floatY = -cssEaseInOut(halfP) * (8 * SCALE);

        ctx.beginPath();
        ctx.arc(CENTER, CENTER + floatY, baseR, 0, Math.PI * 2);
        ctx.fillStyle = '#00f2fe';
        ctx.fill();

        const innerR = (110 - 3) * SCALE;
        ctx.save();
        ctx.beginPath();
        ctx.arc(CENTER, CENTER + floatY, innerR, 0, Math.PI * 2);
        ctx.clip();
        drawImageCover(ctx, userImg, CENTER - innerR, CENTER + floatY - innerR, innerR * 2, innerR * 2);
        ctx.restore();

      } else if (currentStyle === 'slanted') {
        let pIn = 1, pOut = 0;
        if (t < 0.22) {
          pIn = t / 0.22;
          pOut = 0;
        } else if (t < 0.82) {
          pIn = 1;
          pOut = 0;
        } else {
          pIn = 1;
          pOut = (t - 0.82) / 0.18;
        }
        drawSlantedStrips(pIn, pOut);

      } else if (currentStyle === 'ink') {
        // Slow, smooth in-bloom (first 32% of loop ~ 2.9s), then holds fully bloomed in organic ink shape (no out animation!)
        const p = Math.min(1.0, t / 0.32);
        drawInkBloom(p);
      }
    }

    // Live Preview Loop: 6000ms for Liquid Mask, 7000ms for Slanted, 9000ms for Ink, 3000ms for Neon/Pulse
    function animatePreview(now) {
      if (!isExporting) {
        const elapsed = now - animStartTime;
        let loopDuration = 3000;
        if (currentStyle === 'blob') loopDuration = 6000;
        else if (currentStyle === 'slanted') loopDuration = 7000;
        else if (currentStyle === 'ink') loopDuration = 9000;

        const t = (elapsed % loopDuration) / loopDuration;
        renderFrame(t);
      }
      requestAnimationFrame(animatePreview);
    }
    requestAnimationFrame(animatePreview);

    // Export 300x300 HD Transparent GIF at 1:1 Exact Real-Time Speed
    document.getElementById('exportBtn').addEventListener('click', async () => {
      if (isExporting) return;
      isExporting = true;

      const exportBtn = document.getElementById('exportBtn');
      const statusText = document.getElementById('statusText');
      exportBtn.disabled = true;

      try {
        // Exact Real-Time Frame Schedule:
        // Liquid Mask = 6000ms (150 frames @ 40ms)
        // Neon / Pulse = 3000ms (75 frames @ 40ms)
        // Slanted = 63 frames (38 in @ 40ms + 1 hold @ 6000ms + 24 out @ 40ms)
        // Ink Bloom = 51 frames (50 slow in @ 50ms = 2.5s + 1 hold @ 6000ms, NO out animation!)
        const framesConfig = [];
        if (currentStyle === 'slanted') {
          const IN_FRAMES = 38;
          const OUT_FRAMES = 24;
          const HOLD_DELAY = 6000;

          for (let i = 0; i < IN_FRAMES; i++) {
            const p = (i + 1) / IN_FRAMES;
            framesConfig.push({
              pIn: p,
              pOut: 0,
              delay: 40
            });
          }
          framesConfig.push({
            pIn: 1,
            pOut: 0,
            delay: HOLD_DELAY
          });
          for (let i = 0; i < OUT_FRAMES; i++) {
            framesConfig.push({
              pIn: 1,
              pOut: (i + 1) / OUT_FRAMES,
              delay: 40
            });
          }
        } else if (currentStyle === 'ink') {
          const BLOOM_FRAMES = 50;
          const DELAY = 50; // 50ms per frame for a smooth, slow, gentle bloom
          const HOLD_DELAY = 6000; // 6 seconds hold (no out animation!)

          for (let i = 0; i < BLOOM_FRAMES; i++) {
            const p = (i + 1) / BLOOM_FRAMES;
            framesConfig.push({
              p: p,
              delay: DELAY
            });
          }
          framesConfig.push({
            p: 1.0,
            delay: HOLD_DELAY
          });
        } else {
          const loopDuration = currentStyle === 'blob' ? 6000 : 3000;
          const delay = 40;
          const count = loopDuration / delay;
          for (let i = 0; i < count; i++) {
            framesConfig.push({
              t: i / count,
              delay: delay
            });
          }
        }

        const totalFrames = framesConfig.length;
        const gif = GIFEncoder();

        for (let i = 0; i < totalFrames; i++) {
          statusText.textContent = `Rendering HD Frame ${i + 1} / ${totalFrames} (300x300)...`;
          if (i % 3 === 0) {
            await new Promise(r => setTimeout(r, 8));
          }

          const cfg = framesConfig[i];
          if (currentStyle === 'slanted') {
            drawSlantedStrips(cfg.pIn, cfg.pOut);
          } else if (currentStyle === 'ink') {
            drawInkBloom(cfg.p);
          } else {
            renderFrame(cfg.t);
          }

          // Downsample 900x900 -> 300x300
          exportCtx.clearRect(0, 0, EXPORT_SIZE, EXPORT_SIZE);
          exportCtx.drawImage(previewCanvas, 0, 0, RENDER_SIZE, RENDER_SIZE, 0, 0, EXPORT_SIZE, EXPORT_SIZE);

          const imgData = exportCtx.getImageData(0, 0, EXPORT_SIZE, EXPORT_SIZE);
          const data = imgData.data;

          // Un-premultiply edge pixels & separate opaque pixels for full 24-bit rgb888 quantization
          const opaqueRGB = [];
          for (let p = 0; p < data.length; p += 4) {
            const a = data[p + 3];
            if (a >= 128) {
              // Boost partially anti-aliased edge pixels back to full brightness so border stays clean
              if (a < 255) {
                const factor = 255 / a;
                data[p] = Math.min(255, Math.round(data[p] * factor));
                data[p + 1] = Math.min(255, Math.round(data[p + 1] * factor));
                data[p + 2] = Math.min(255, Math.round(data[p + 2] * factor));
              }
              data[p + 3] = 255;
              opaqueRGB.push(data[p], data[p + 1], data[p + 2], 255);
            } else {
              data[p + 3] = 0;
            }
          }

          let fullPalette;
          const indexedFrame = new Uint8Array(EXPORT_SIZE * EXPORT_SIZE);

          if (opaqueRGB.length === 0) {
            // 100% transparent frame (safe handling, prevents empty quantize crash)
            fullPalette = [[0, 0, 0], [0, 0, 0]];
          } else {
            // Full 24-bit 'rgb888' quantization on opaque pixels only (No grain, maximum HD photo sharpness!)
            const opaqueBytes = new Uint8Array(opaqueRGB);
            const maxColors = Math.min(255, Math.max(2, Math.floor(opaqueRGB.length / 4)));
            const subPalette = quantize(opaqueBytes, maxColors, { format: 'rgb888' });
            fullPalette = [[0, 0, 0], ...subPalette]; // Index 0 = 100% Transparent

            // Map opaque pixels via fast rgb888 lut and keep transparent pixels at index 0
            const mappedOpaque = applyPalette(opaqueBytes, subPalette, 'rgb888');

            let opaqueCounter = 0;
            for (let idx = 0, p = 0; idx < indexedFrame.length; idx++, p += 4) {
              if (data[p + 3] === 255) {
                indexedFrame[idx] = mappedOpaque[opaqueCounter++] + 1;
              } else {
                indexedFrame[idx] = 0;
              }
            }
          }

          gif.writeFrame(indexedFrame, EXPORT_SIZE, EXPORT_SIZE, {
            palette: fullPalette,
            delay: cfg.delay,
            transparent: true,
            transparentIndex: 0,
            dispose: 2
          });
        }

        gif.finish();
        statusText.textContent = 'Downloading 300x300 HD GIF...';

        const bytes = gif.bytes();
        const blob = new Blob([bytes], { type: 'image/gif' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `liquid-profile-${currentStyle}-300x300.gif`;
        a.click();
        URL.revokeObjectURL(url);

        isExporting = false;
        exportBtn.disabled = false;
        animStartTime = performance.now();
        statusText.textContent = `✅ 300x300 HD GIF Exported (${currentStyle.toUpperCase()})!`;
      } catch (err) {
        console.error('Export failed:', err);
        statusText.textContent = `❌ Export error: ${err.message}`;
        isExporting = false;
        exportBtn.disabled = false;
        animStartTime = performance.now();
      }
    });
  </script>
</body>
